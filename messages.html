<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages — IGCA</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/messages.css">
</head>

<body>

<div class="app-shell">

  <aside class="app-sidebar"></aside>

  <div class="app-main">

    <header class="app-header"></header>

    <main class="app-content messages-page">

      <!-- PAGE HEADER -->
      <div class="page-head messages-page-head">

        <div>
          <h1>Messages</h1>
          <p>Conversations with your professional network.</p>
        </div>

      </div>


      <!-- MESSAGES APP -->
      <section class="messages-shell" id="messages-shell">

        <!-- LEFT SIDEBAR -->
        <aside class="convo-list" id="convo-list">

          <div class="convo-header">

            <div class="convo-title-row">

              <div>
                <h2>Chats</h2>
                <span id="conversation-count">0 connections</span>
              </div>

            </div>

            <div class="conversation-search">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M21 21l-4.3-4.3"></path>
              </svg>

              <input
                id="conversation-search-input"
                type="text"
                placeholder="Search chats..."
                autocomplete="off"
              >

            </div>

          </div>


          <div
            class="convo-items"
            id="convo-items"
          >

            <div class="messages-loading">
              <div class="loading-spinner"></div>
              <span>Loading chats...</span>
            </div>

          </div>

        </aside>


        <!-- RIGHT CHAT -->
        <section
          class="chat-window"
          id="chat-window"
        >

          <div class="chat-empty">

            <div class="chat-empty-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-4-.9L3 21l1.8-4.7A8.3 8.3 0 0 1 3 11.5a8.5 8.5 0 1 1 18 0z"></path>
              </svg>
            </div>

            <h2>Your Messages</h2>

            <p>
              Select a connection to start a professional conversation.
            </p>

          </div>

        </section>

      </section>

    </main>

  </div>

</div>


<nav class="bottom-nav"></nav>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/messages.js"></script>

</body>
</html>
