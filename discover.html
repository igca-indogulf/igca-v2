<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — IGCA</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar"></aside>
  <div class="app-main">
    <header class="app-header"></header>
    <main class="app-content">

      <div class="page-head">
        <div><h1>Discover Your Network</h1><p>Search verified professionals, companies and opportunities.</p></div>
      </div>

      <div class="search-bar" style="max-width:680px;margin-bottom:24px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="discover-search" placeholder="Search by name, company, industry or expertise...">
        <button class="btn btn-primary btn-sm">Search</button>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="people">People</div>
        <div class="tab" data-tab="companies">Companies</div>
        <div class="tab" data-tab="opportunities">Opportunities</div>
      </div>

      <div class="discover-layout">
        <div class="discover-layout">

  <aside class="filters-panel">
    <div class="filter-loading">
      Loading filters...
    </div>
  </aside>

  <section style="min-width:0;">

    <div
      id="tab-people"
      class="grid-people"
    ></div>

    <div
      id="tab-companies"
      class="grid-people"
      style="display:none;"
    ></div>

    <div
      id="tab-opportunities"
      class="grid-3"
      style="display:none;"
    ></div>

  </section>

</div>
        <section style="min-width:0;">
          <div id="tab-people" class="grid-people"></div>
          <div id="tab-companies" class="grid-people" style="display:none;"></div>
          <div id="tab-opportunities" class="grid-3" style="display:none;"></div>
        </section>
      </div>

    </main>
  </div>
</div>
<nav class="bottom-nav"></nav>

<style>
  .discover-layout{ display:grid; grid-template-columns:250px 1fr; gap:24px; }
  @media (max-width:900px){ .discover-layout{ grid-template-columns:1fr; } .filters-panel{ order:2; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/discover.js"></script>
</body>
</html>
