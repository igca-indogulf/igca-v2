<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile — IGCA</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/profile.css">
</head>

<body>

<div class="app-shell">

  <aside class="app-sidebar"></aside>

  <div class="app-main">

    <header class="app-header"></header>

    <main class="app-content">

      <!-- =========================================================
           PROFILE HERO
      ========================================================== -->

      <section class="profile-hero card">

        <div class="profile-hero-main">

          <!-- Avatar -->

          <div
            class="profile-avatar-wrap"
            aria-label="Profile photo">

            <div
              class="avatar avatar-lg profile-avatar"
              id="p-avatar">
              IG
            </div>

          </div>


          <!-- Main information -->

          <div class="profile-identity">

            <div class="profile-name-line">

              <h1 id="p-name">
                Loading...
              </h1>

              <span id="p-verify"></span>

            </div>


            <p
              id="p-title"
              class="profile-headline">
            </p>


            <p
              id="p-meta"
              class="profile-meta">
            </p>

          </div>


          <!-- Own Profile -->

          <div
            class="profile-actions"
            id="own-profile-actions"
            style="display:none;">

            <a
              href="settings.html"
              class="btn btn-outline">

              Edit Profile

            </a>

            <a
              href="posts.html"
              class="btn btn-primary">

              + New Post

            </a>

          </div>


          <!-- Other Profile -->

          <div
            class="profile-actions"
            id="other-profile-actions"
            style="display:none;">

            <button
              class="btn btn-primary"
              id="profile-connect-btn"
              type="button">

              Connect

            </button>

            <button
              class="btn btn-outline"
              id="profile-message-btn"
              type="button">

              Message

            </button>

            <button
              class="btn btn-outline"
              id="profile-meeting-btn"
              type="button">

              Request Meeting

            </button>

            <button
              class="btn btn-ghost btn-icon"
              id="profile-follow-btn"
              type="button"
              title="Follow"
              aria-label="Follow">

              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                  d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.3l-4.8 2.6.9-5.4-3.9-3.8z"/>

              </svg>

            </button>

          </div>

        </div>

      </section>


      <!-- =========================================================
           PROFILE BODY
      ========================================================== -->

      <div class="profile-layout">

        <!-- =======================================================
             MAIN COLUMN
        ======================================================== -->

        <div class="profile-main-column">


          <!-- ABOUT -->

          <section class="profile-section card">

            <div class="profile-section-head">

              <h2>
                About
              </h2>

            </div>

            <div class="profile-section-body">

              <p
                id="p-about"
                class="profile-about">
              </p>

            </div>

          </section>


          <!-- EXPERIENCE -->

          <section class="profile-section card">

            <div class="profile-section-head">

              <h2>
                Experience
              </h2>

            </div>

            <div class="profile-section-body">

              <div class="experience-item">

                <div class="experience-icon">
                  <span>
                    IG
                  </span>
                </div>

                <div class="experience-content">

                  <strong>
                    <span id="p-exp-current">
                    </span>
                  </strong>

                  <span class="experience-current">
                    Current role
                  </span>

                  <span class="experience-time">
                    Present
                  </span>

                </div>

              </div>

            </div>

          </section>


          <!-- EXPERTISE -->

          <section class="profile-section card">

            <div class="profile-section-head">

              <h2>
                Expertise &amp; Industries
              </h2>

            </div>

            <div class="profile-section-body">

              <div
                class="profile-chips"
                id="p-expertise">
              </div>

            </div>

          </section>


          <!-- POSTS -->

          <section class="profile-section card">

            <div class="profile-section-head">

              <h2>
                Recent Posts
              </h2>

            </div>

            <div class="profile-section-body">

              <div
                class="profile-posts"
                id="p-posts">
              </div>

            </div>

          </section>

        </div>


        <!-- =======================================================
             SIDEBAR
        ======================================================== -->

        <aside class="profile-sidebar">


          <!-- EDUCATION -->

          <section class="profile-side-card card">

            <div class="profile-side-head">

              <h3>
                Education &amp; Certifications
              </h3>

            </div>

            <div class="profile-side-body">

              <div class="profile-side-empty">

                <div class="profile-side-empty-icon">
                  +
                </div>

                <p>
                  Add your education and certifications from Settings.
                </p>

              </div>

            </div>

          </section>


          <!-- NETWORK -->

          <section class="profile-side-card card">

            <div class="profile-side-head">

              <h3>
                Network
              </h3>

            </div>

            <div class="profile-side-body">

              <div id="p-network"></div>

            </div>

          </section>


        </aside>

      </div>

    </main>

  </div>

</div>


<nav class="bottom-nav"></nav>


<!-- ===============================================================
     SCRIPTS
================================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
