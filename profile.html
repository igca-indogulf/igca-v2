<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile — IGCA</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
  .profile-header{
    padding:32px;
    margin-bottom:24px;
    position:relative;
    overflow:hidden;
  }

  .profile-cover{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:105px;
    background:
      linear-gradient(
        120deg,
        var(--primary-dark),
        var(--primary-tint)
      );
  }

  .profile-main-row{
    display:flex;
    gap:20px;
    align-items:flex-end;
    position:relative;
    padding-top:55px;
  }

  .profile-main-info{
    flex:1;
    min-width:0;
  }

  .profile-name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .profile-name-row h1{
    font-size:24px;
    margin:0;
  }

  .profile-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .profile-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 280px;
    gap:20px;
  }

  .exp-item{
    padding:12px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .exp-item:last-child{
    border-bottom:none;
  }

  .profile-avatar{
    flex-shrink:0;
    position:relative;
    z-index:2;
    border:4px solid var(--surface);
  }

  #p-network{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  @media(max-width:900px){

    .profile-layout{
      grid-template-columns:1fr;
    }

    .profile-main-row{
      align-items:flex-start;
      flex-direction:column;
      padding-top:55px;
    }

    .profile-actions{
      width:100%;
    }

  }

  @media(max-width:600px){

    .profile-header{
      padding:18px;
    }

    .profile-main-row{
      gap:14px;
    }

    .profile-actions{
      display:grid;
      grid-template-columns:1fr;
      width:100%;
    }

    .profile-actions .btn{
      width:100%;
      justify-content:center;
    }

  }
</style>
</head>

<body>

<div class="app-shell">

  <aside class="app-sidebar"></aside>

  <div class="app-main">

    <header class="app-header"></header>

    <main class="app-content">

      <!-- =========================================================
           PROFILE HEADER
      ========================================================== -->

      <section class="profile-header card">

        <div class="profile-cover" aria-hidden="true"></div>

        <div class="profile-main-row">

          <div
            class="avatar avatar-lg profile-avatar"
            id="p-avatar">
            IG
          </div>

          <div class="profile-main-info">

            <div class="profile-name-row">

              <h1 id="p-name">
                Loading...
              </h1>

              <span id="p-verify"></span>

            </div>

            <p
              id="p-title"
              class="text-secondary"
              style="margin-top:4px;font-size:15px;">
            </p>

            <p
              id="p-meta"
              class="text-secondary"
              style="margin-top:4px;font-size:13.5px;">
            </p>

          </div>

<!-- OWN PROFILE -->
<div
  class="profile-actions"
  id="own-profile-actions"
  style="display:none;">

  <a
    href="settings.html"
    class="btn btn-outline">
    Edit Profile
  </a>

  <a
    href="posts.html"
    class="btn btn-primary">
    + New Post
  </a>

</div>

          <!-- OTHER USER PROFILE -->
          <div
            class="profile-actions"
            id="other-profile-actions"
            style="display:none;">

            <button
              class="btn btn-primary"
              type="button">

              Connect

            </button>

            <button
              class="btn btn-outline"
              type="button">

              Message

            </button>

            <button
              class="btn btn-outline"
              type="button">

              Request Meeting

            </button>

            <button
              class="btn btn-ghost btn-icon"
              type="button"
              title="Follow"
              aria-label="Follow">

              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path
                  d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.3l-4.8 2.6.9-5.4-3.9-3.8z"/>

              </svg>

            </button>

          </div>

        </div>

      </section>


      <!-- =========================================================
           PROFILE CONTENT
      ========================================================== -->

      <div class="profile-layout">

        <div>

          <!-- ABOUT -->

          <div
            class="card card-pad"
            style="margin-bottom:20px;">

            <h3
              style="font-size:16px;margin-bottom:10px;">
              About
            </h3>

            <p
              class="text-secondary"
              id="p-about"
              style="
                font-size:14.5px;
                line-height:1.7;
              ">
            </p>

          </div>


          <!-- EXPERIENCE -->

          <div
            class="card card-pad"
            style="margin-bottom:20px;">

            <h3
              style="
                font-size:16px;
                margin-bottom:14px;
              ">

              Experience

            </h3>

            <div class="exp-item">

              <strong>
                Current role
              </strong>

              <span
                id="p-exp-current"
                class="text-secondary">
              </span>

              <div class="meta">
                Present
              </div>

            </div>

          </div>


          <!-- EXPERTISE -->

          <div
            class="card card-pad"
            style="margin-bottom:20px;">

            <h3
              style="
                font-size:16px;
                margin-bottom:12px;
              ">

              Expertise &amp; Industries

            </h3>

            <div
              class="chip-row"
              id="p-expertise">
            </div>

          </div>


          <!-- POSTS -->

          <div class="card card-pad">

            <h3
              style="
                font-size:16px;
                margin-bottom:14px;
              ">

              Recent Posts

            </h3>

            <div
              class="grid-3"
              id="p-posts">
            </div>

          </div>

        </div>


        <!-- =======================================================
             RIGHT SIDEBAR
        ======================================================== -->

        <aside>

          <div
            class="card card-pad"
            style="margin-bottom:20px;">

            <h3
              style="
                font-size:15px;
                margin-bottom:12px;
              ">

              Education &amp; Certifications

            </h3>

            <p
              class="text-secondary"
              style="font-size:13.5px;">

              Add education and certifications from Settings.

            </p>

          </div>


          <div class="card card-pad">

            <h3
              style="
                font-size:15px;
                margin-bottom:12px;
              ">

              Network

            </h3>

            <div id="p-network"></div>

          </div>

        </aside>

      </div>

    </main>

  </div>

</div>

<nav class="bottom-nav"></nav>


<!-- ===============================================================
     SCRIPTS
================================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
