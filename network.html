<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Network — IGCA</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/network.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar"></aside>
  <div class="app-main">
    <header class="app-header"></header>
    <main class="app-content">
<div class="page-head">
  <div>
    <h1>My Network</h1>
    <p>Build and manage your professional network.</p>
  </div>
</div>
     
      <div class="stat-grid" style="margin-bottom:8px;">
        <div class="stat-card"><div class="num" id="stat-connections">0</div><div class="label">Connections</div></div>
        <div class="stat-card"><div class="num" id="stat-requests">0</div><div class="label">Requests Received</div></div>
        <div class="stat-card"><div class="num" id="stat-sent">0</div><div class="label">Requests Sent</div></div>
        <div class="stat-card"><div class="num" id="stat-suggested">0</div><div class="label">Suggested</div></div>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="connections">My Connections</div>
        <div class="tab" data-tab="requests">Connection Requests</div>
        <div class="tab" data-tab="sent">Sent Requests</div>
        <div class="tab" data-tab="suggested">Suggested Connections</div>
      </div>

      <div id="pane-connections" class="grid-people"></div>
      <div id="pane-requests" class="grid-people" style="display:none;"></div>
      <div id="pane-sent" class="grid-people" style="display:none;"></div>
      <div id="pane-suggested" class="grid-people" style="display:none;"></div>

    </main>
  </div>
</div>
<nav class="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/network.js"></script>
</body>
</html>
